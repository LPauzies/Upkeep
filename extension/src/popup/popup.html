<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Upkeep Settings</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <div class="brand-wrap">
        <img src="../../icons/icon-32.png" alt="Upkeep" class="brand-icon" width="24" height="24" />
        <div class="brand-meta">
          <div class="brand">Upkeep</div>
          <div class="status-text" id="status-text">Active on endstep.cc</div>
        </div>
      </div>
      <label class="power-switch" title="Enable or disable Upkeep on endstep.cc">
        <input type="checkbox" id="toggle-enabled" />
        <span class="power-track" aria-hidden="true">
          <span class="power-thumb"></span>
        </span>
      </label>
    </header>

    <div class="disabled-banner" id="disabled-banner" hidden>
      Upkeep is disabled — original Endstep UI is active.
    </div>

    <main class="content" id="settings-content">
      <div class="section-label">Layout &amp; Panels</div>
      <label class="row">
        <span>Horizontal Phase Timeline (midline)</span>
        <input type="checkbox" id="toggle-timeline" />
      </label>
      <label class="row">
        <span>Dual Graveyards in right rail (Opp + You)</span>
        <input type="checkbox" id="toggle-gy" />
      </label>
      <label class="row">
        <span>Auto-open &amp; dock Game Log (left rail)</span>
        <input type="checkbox" id="toggle-logs" />
      </label>
      <label class="row">
        <span>Hide right-side action notifications</span>
        <input type="checkbox" id="toggle-toasts" />
      </label>
      <label class="row">
        <span>Anchor "The Stack" at top-left of board</span>
        <input type="checkbox" id="toggle-stack" />
      </label>

      <div class="divider"></div>
      <div class="section-label">Readability</div>
      <label class="row">
        <span>High-legibility Player Plates</span>
        <input type="checkbox" id="toggle-hud" />
      </label>
      <label class="row">
        <span>Card hover zoom in Graveyards</span>
        <input type="checkbox" id="toggle-zoom" />
      </label>

      <div class="divider"></div>
      <div class="section-head">
        <div class="section-label">Colors &amp; Colorblind</div>
        <button type="button" id="btn-reset-colors" class="btn-inline">Reset</button>
      </div>
      <label class="select-row" for="select-colorblind">
        <span>Colorblind preset</span>
        <select id="select-colorblind" class="select-input">
          <option value="none">Standard</option>
          <option value="deuteranopia">Deuteranopia / Protanopia</option>
          <option value="tritanopia">Tritanopia</option>
          <option value="high-contrast">High Contrast</option>
        </select>
      </label>
      <label class="select-row" for="select-bf-style">
        <span>Battlefield style</span>
        <select id="select-bf-style" class="select-input">
          <option value="solid">Solid (Upkeep)</option>
          <option value="gradient">Gradient (Endstep)</option>
        </select>
      </label>
      <label class="row">
        <span>Subtle battlefield texture</span>
        <input type="checkbox" id="toggle-bf-texture" />
      </label>
      <div id="popup-colors-grid" class="colors-grid"></div>
      <div id="popup-color-editor" class="color-editor" hidden>
        <div class="color-editor-head">
          <span id="color-editor-title" class="color-editor-title">Color</span>
          <div class="color-editor-actions">
            <button type="button" id="color-editor-reset" class="btn-inline" title="Reset this color to preset default">Reset</button>
            <button type="button" id="color-editor-close" class="color-editor-close" aria-label="Close color picker">×</button>
          </div>
        </div>
        <div id="color-sv-pad" class="color-sv-pad" role="slider" aria-label="Saturation and brightness" tabindex="0">
          <div class="color-sv-white"></div>
          <div class="color-sv-black"></div>
          <div id="color-sv-thumb" class="color-sv-thumb"></div>
        </div>
        <div id="color-hue-bar" class="color-hue-bar" role="slider" aria-label="Hue" tabindex="0">
          <div id="color-hue-thumb" class="color-hue-thumb"></div>
        </div>
        <div class="color-editor-row">
          <span id="color-editor-preview" class="color-editor-preview"></span>
          <input
            type="text"
            id="color-editor-hex"
            class="color-editor-hex"
            maxlength="7"
            spellcheck="false"
            autocomplete="off"
            aria-label="Hex color code"
          />
        </div>
        <div id="color-editor-swatches" class="color-swatches"></div>
      </div>
    </main>

    <footer class="footer">
      <div class="shortcuts-hint">
        Shortcuts: <kbd>U</kbd> On/Off · <kbd>G</kbd> Graveyards · <kbd>L</kbd> Logs
      </div>
      <button type="button" id="btn-options" class="btn-secondary">Colors &amp; DOM Settings</button>
      <a
        id="btn-donate"
        class="btn-donate"
        href="https://www.paypal.com/donate/?hosted_button_id=KG4BYMHFBMWCN"
        target="_blank"
        rel="noopener noreferrer"
      >
        <svg class="btn-donate-icon" viewBox="0 0 24 24" width="13" height="13" aria-hidden="true" fill="currentColor">
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
        </svg>
        <span>Donate via PayPal</span>
      </a>
    </footer>
    <script src="popup.js"></script>
  </body>
</html>
