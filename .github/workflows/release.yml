name: CD — Release & Publish (Manual / Tag Only)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Incrément SemVer automatique depuis le dernier tag (ignoré si Version explicite renseignée)'
        type: choice
        default: 'patch'
        options:
          - patch
          - minor
          - major
      version:
        description: 'Version explicite optionnelle (ex: 1.2.0 — laisser vide pour utiliser le bump ci-dessus)'
        required: false
        default: ''
      publish_chrome_store:
        description: 'Publier sur le Chrome Web Store si les secrets sont configurés'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Publish GitHub Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout repository (with tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compute SemVer version (Chrome & Firefox MV3 compatible)
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            RAW="${GITHUB_REF#refs/tags/v}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            RAW="${{ inputs.version }}"
            RAW="${RAW#v}"
          else
            LATEST_TAG=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
            if [[ -z "$LATEST_TAG" ]]; then
              RAW="1.0.0"
            else
              BASE="${LATEST_TAG#v}"
              IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"
              MAJOR=${MAJOR:-1}
              MINOR=${MINOR:-0}
              PATCH=${PATCH:-0}
              case "${{ inputs.bump }}" in
                major)
                  MAJOR=$((MAJOR + 1))
                  MINOR=0
                  PATCH=0
                  ;;
                minor)
                  MINOR=$((MINOR + 1))
                  PATCH=0
                  ;;
                *)
                  PATCH=$((PATCH + 1))
                  ;;
              esac
              RAW="${MAJOR}.${MINOR}.${PATCH}"
            fi
          fi

          if [[ ! "$RAW" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]; then
            echo "Erreur: version SemVer invalide '$RAW' (format attendu: X.Y.Z)"
            exit 1
          fi

          echo "version=${RAW}" >> "$GITHUB_OUTPUT"
          echo "tag=v${RAW}" >> "$GITHUB_OUTPUT"
          echo "Resolved release version: v${RAW}"

      - name: Build Chrome & Firefox MV3 packages
        run: node scripts/build-extension.mjs --target=all --version=${{ steps.meta.outputs.version }}

      - name: Validate Firefox bundle with web-ext lint (AMO listed)
        run: npx --yes web-ext lint --source-dir dist-extension/firefox --warnings-as-errors

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: upkeep-release-zips
          path: |
            artifacts/upkeep-chrome-*.zip
            artifacts/upkeep-firefox-*.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Upkeep ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          make_latest: true
          files: |
            artifacts/upkeep-firefox-v${{ steps.meta.outputs.version }}.zip
            artifacts/upkeep-chrome-v${{ steps.meta.outputs.version }}.zip

  publish-chrome-web-store:
    name: Publish to Chrome Web Store
    needs: build-release
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || inputs.publish_chrome_store == true }}
    steps:
      - name: Download Chrome ZIP artifact
        uses: actions/download-artifact@v4
        with:
          name: upkeep-release-zips
          path: release-bundle

      - name: Check Chrome Web Store secrets & archive path
        id: check_chrome
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: |
          MISSING=()
          [ -z "$CHROME_EXTENSION_ID" ] && MISSING+=("CHROME_EXTENSION_ID")
          [ -z "$CHROME_PUBLISHER_ID" ] && MISSING+=("CHROME_PUBLISHER_ID")
          [ -z "$CHROME_CLIENT_ID" ] && MISSING+=("CHROME_CLIENT_ID")
          [ -z "$CHROME_CLIENT_SECRET" ] && MISSING+=("CHROME_CLIENT_SECRET")
          [ -z "$CHROME_REFRESH_TOKEN" ] && MISSING+=("CHROME_REFRESH_TOKEN")

          if [ "${#MISSING[@]}" -gt 0 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Chrome Web Store secrets manquants (${MISSING[*]}) — étape ignorée."
            exit 0
          fi

          CHROME_ZIP=$(find release-bundle -type f -name "upkeep-chrome-v${{ needs.build-release.outputs.version }}.zip" | head -n 1)
          if [ -z "$CHROME_ZIP" ]; then
            echo "Erreur: archive upkeep-chrome-v${{ needs.build-release.outputs.version }}.zip introuvable dans release-bundle/"
            find release-bundle -maxdepth 3 -ls
            exit 1
          fi

          echo "zip_path=${CHROME_ZIP}" >> "$GITHUB_OUTPUT"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Upload & publish to Chrome Web Store (API v2)
        if: steps.check_chrome.outputs.ready == 'true'
        uses: mnao305/chrome-extension-upload@v7.0.0
        with:
          file-path: ${{ steps.check_chrome.outputs.zip_path }}
          extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
          publisher-id: ${{ secrets.CHROME_PUBLISHER_ID }}
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}
          publish: true
